[project]
name = "sunweg-integration"
version = "2.0.0"
description = "Home Assistant integration for SunWEG (WEG) and FusionSolar (Huawei) solar plants"
requires-python = ">=3.12"

[project.optional-dependencies]
test = ["pytest-homeassistant-custom-component", "ruff"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
